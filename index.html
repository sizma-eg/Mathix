    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {

            --bg: #060607;
            --panel: #0d0d10;
            --card: #111115;
            --card2: #17171c;

            --text: #f7f7fa;
            --muted: #92929e;
            --silver: #d7d7dd;

            --purple: #9b5cff;
            --purple2: #6e32ff;

            --green: #56d69a;
            --yellow: #e9c66b;
            --red: #ff667d;

            --line: rgba(255,255,255,.08);

            --shadow:
                0 25px 90px rgba(0,0,0,.48);

        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            color: var(--text);

            font-family: "Cairo", sans-serif;

            background:

                radial-gradient(
                    circle at 85% 5%,
                    rgba(155,92,255,.12),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 10% 90%,
                    rgba(255,255,255,.035),
                    transparent 25%
                ),

                var(--bg);

            overflow-x: hidden;

        }


        button,
        input,
        select,
        textarea {

            font: inherit;

        }


        button {

            cursor: pointer;

        }


        a {

            color: inherit;
            text-decoration: none;

        }


        img {

            max-width: 100%;
            display: block;

        }


        .hidden {

            display: none !important;

        }


        .muted {

            color: var(--muted);

        }


        /* =========================================================
           LANDING
        ========================================================= */

        .landing {

            min-height: 100vh;

            display: grid;

            place-items: center;

            padding: 25px;

            position: relative;

            overflow: hidden;

        }


        .landing::before {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(155,92,255,.10);

            filter: blur(100px);

            top: -220px;
            right: -170px;

        }


        .landing-card {

            width: min(1100px, 100%);

            display: grid;

            grid-template-columns:
                1.15fr .85fr;

            gap: 25px;

            align-items: center;

            padding: 45px;

            border:
                1px solid var(--line);

            border-radius: 30px;

            background:
                rgba(13,13,16,.78);

            backdrop-filter:
                blur(20px);

            box-shadow:
                var(--shadow);

            position: relative;

            z-index: 1;

        }


        .landing-content {

            min-width: 0;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand img {

            width: 55px;
            height: 55px;

            object-fit: contain;

        }


        .brand-name {

            font-family:
                "Chakra Petch",
                sans-serif;

            font-size: 27px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .brand-name span {

            color: var(--purple);

        }


        .landing-title {

            font-size:
                clamp(
                    38px,
                    6vw,
                    68px
                );

            line-height: 1.08;

            margin: 32px 0 18px;

        }


        .gradient {

            background:
                linear-gradient(
                    110deg,
                    #ffffff,
                    #b979ff
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

        }


        .landing-description {

            color: var(--muted);

            font-size: 16px;

            line-height: 2;

            max-width: 650px;

            margin-bottom: 25px;

        }


        .actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .btn {

            border:
                1px solid var(--line);

            background:
                var(--card);

            color: #fff;

            border-radius: 12px;

            padding: 11px 17px;

            font-weight: 700;

            transition: .25s;

        }


        .btn:hover {

            transform:
                translateY(-2px);

            border-color:
                rgba(155,92,255,.45);

        }


        .btn.primary {

            border: 0;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--purple2)
                );

            box-shadow:
                0 12px 35px
                rgba(110,50,255,.22);

        }


        .btn.small {

            padding:
                7px 10px;

            font-size: 12px;

        }


        .hero-logo {

            min-height: 360px;

            display: grid;

            place-items: center;

            border:
                1px solid var(--line);

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(155,92,255,.06)
                );

        }


        .hero-logo img {

            width:
                min(310px, 75%);

            filter:
                drop-shadow(
                    0 0 35px
                    rgba(155,92,255,.25)
                );

            animation:
                logoFloat 4s ease-in-out infinite;

        }


        @keyframes logoFloat {

            50% {

                transform:
                    translateY(-10px);

            }

        }


        /* =========================================================
           AUTH
        ========================================================= */

        .auth-wrap {

            min-height: 100vh;

            display: grid;

            place-items: center;

            padding: 25px;

        }


        .auth-box {

            width:
                min(460px, 100%);

            padding: 32px;

            background:
                rgba(13,13,16,.92);

            border:
                1px solid var(--line);

            border-radius: 25px;

            box-shadow:
                var(--shadow);

        }


        .auth-head {

            text-align: center;

            margin-bottom: 25px;

        }


        .auth-head img {

            width: 80px;
            height: 80px;

            object-fit: contain;

            margin: auto;

        }


        .auth-head h2 {

            margin-top: 10px;

        }


        .auth-head p {

            color: var(--muted);

            margin-top: 5px;

            font-size: 13px;

        }


        .field {

            margin-bottom: 15px;

        }


        .field label {

            display: block;

            color: var(--muted);

            font-size: 12px;

            margin-bottom: 6px;

        }


        .field input {

            width: 100%;

            padding: 12px 13px;

            color: #fff;

            background:
                #0a0a0d;

            border:
                1px solid var(--line);

            border-radius: 11px;

            outline: none;

        }


        .field input:focus {

            border-color:
                rgba(155,92,255,.6);

            box-shadow:
                0 0 0 3px
                rgba(155,92,255,.08);

        }


        .auth-message {

            min-height: 22px;

            margin: 10px 0;

            color:
                #ff8ea5;

            font-size: 12px;

            line-height: 1.7;

        }


        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 18px 0;

            color: var(--muted);

            font-size: 11px;

        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            background: var(--line);

            flex: 1;

        }


        /* =========================================================
           APPLICATION
        ========================================================= */

        .app {

            display: grid;

            grid-template-columns:
                255px 1fr;

            min-height: 100vh;

        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {

            position: sticky;

            top: 0;

            height: 100vh;

            padding: 20px 14px;

            background:
                rgba(8,8,9,.88);

            backdrop-filter:
                blur(18px);

            border-left:
                1px solid var(--line);

            z-index: 50;

            overflow-y: auto;

        }


        .side-brand {

            padding:
                8px 8px 22px;
